# Roda o agente (Claude Code) quando o dono do repositório menciona @claude
# numa issue ou num pull request. O agente responde como o app do Claude.
# Cada menção é uma execução: o agente publica o plano e para, e só segue
# quando o dono responder com uma nova menção.
name: Agente

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Uma execução por vez, na fila: duas tarefas em paralelo disputariam
# o limite da assinatura e os números de docs/decisoes.
concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  agente:
    # Só o dono chama o agente. A action também exige permissão de escrita
    # e recusa bots, mas a checagem aqui evita até subir a máquina.
    if: >-
      contains(github.event.comment.body || github.event.review.body || '', '@claude') &&
      (github.event.comment.user.login || github.event.review.user.login) == 'IgorOlive11'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # O agente lê a issue e os bloqueios com o gh, como a skill ler-a-tarefa pede,
          # roda os comandos de desenvolvimento e o subagente revisor.
          # Comentar, commitar e criar o branch a própria action faz pelas ferramentas dela.
          # O pull request o agente abre com o gh pr create, depois do parecer do revisor.
          claude_args: >-
            --max-turns 80
            --allowedTools "Task,Agent,Bash(gh issue view:*),Bash(gh api repos/IgorOlive11/overload/issues/*/dependencies/blocked_by*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm i:*),Bash(npm test:*),Bash(npm run:*),Bash(npx playwright install:*),Bash(npx playwright test:*),Bash(node design/mock/:*),Bash(node --test:*),Bash(gh pr create:*)"
            --append-system-prompt "Neste repositório, quando terminar as mudanças e o subagente revisor der o veredito de pronto para revisão humana, abra você mesmo o pull request com gh pr create --base master --head <o branch atual> --title <título no formato tipo: descrição> --body-file pr-body.md, escrevendo antes o corpo nesse arquivo na raiz do repositório, que é ignorado pelo git e não deve ser commitado. O corpo segue o modelo de .github/pull_request_template.md, começa com Closes #<número da issue> e traz o parecer do revisor na seção Parecer do revisor. Não use o link Create a PR: no comentário de acompanhamento, coloque o link do pull request aberto."
          branch_name_template: "agente/{{entityNumber}}-{{description}}"
