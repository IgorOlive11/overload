name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
