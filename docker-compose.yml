# Implantação no Coolify (build pack Docker Compose), no servidor oracle-a1.
# As senhas são geradas e guardadas pelo próprio Coolify (variáveis SERVICE_PASSWORD_*): nenhuma fica no repositório.
# O app recebe só as conexões como overload_dono (migrações) e overload_api (requisições), nunca o superusuário.
# O banco não publica porta: só o app fala com ele, pela rede interna.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      # Endereço público exato (https://...), usado nos links dos e-mails e na conferência de origem.
      - ORIGEM_PUBLICA=${ORIGEM_PUBLICA}
      - DATABASE_URL=postgres://overload_api:${SERVICE_PASSWORD_API}@banco:5432/overload
      - DATABASE_URL_MIGRACAO=postgres://overload_dono:${SERVICE_PASSWORD_DONO}@banco:5432/overload
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_REMETENTE=${EMAIL_REMETENTE:-Overload <nao-responda@overload.app.br>}
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  banco:
    build:
      context: ./db
      dockerfile: imagem/Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=overload
      - SENHA_OVERLOAD_DONO=${SERVICE_PASSWORD_DONO}
      - SENHA_OVERLOAD_API=${SERVICE_PASSWORD_API}
    volumes:
      - overload-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d overload"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backup diário para o S3 da oracle-micro-1. Sem as três variáveis BACKUP_S3_*, fica desligado e avisa no log.
  backup:
    build:
      context: ./db/backup
    restart: unless-stopped
    environment:
      - SENHA_OVERLOAD_DONO=${SERVICE_PASSWORD_DONO}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT}
      - BACKUP_S3_CHAVE=${BACKUP_S3_CHAVE}
      - BACKUP_S3_SEGREDO=${BACKUP_S3_SEGREDO}
      - BACKUP_S3_BALDE=${BACKUP_S3_BALDE:-overload-backups}
      - BACKUP_DIAS=${BACKUP_DIAS:-30}
    depends_on:
      banco:
        condition: service_healthy

volumes:
  overload-banco:
